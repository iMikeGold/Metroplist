<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" shape-rendering="geometricPrecision">
<title id="title">Metroplist Concept D Fold × Density master monochrome</title>
<desc id="desc">Transparent-background, fully editable vector master with separate fold planes, individual density tiles, and optional vector shadow/highlight effects.</desc>
<defs>
  <clipPath id="RevealClip"><path d="M0 512 L512 0 L512 512 Z"/></clipPath>
  <linearGradient id="CoverGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1D1D1D"/>
    <stop offset="0.58" stop-color="#111111"/>
    <stop offset="1" stop-color="#060606"/>
  </linearGradient>
  <linearGradient id="LeftGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#262626"/>
    <stop offset="0.62" stop-color="#2F2F2F"/>
    <stop offset="1" stop-color="#444444"/>
  </linearGradient>
  <linearGradient id="RevealSheen" x1="1" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.36"/>
    <stop offset="0.22" stop-color="#FFFFFF" stop-opacity="0.18"/>
    <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0.03"/>
    <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
  </linearGradient>
  <filter id="SoftEmboss" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blur"/>
    <feOffset dx="2.5" dy="2.5" result="offsetBlur"/>
    <feFlood flood-color="#000000" flood-opacity="0.22" result="shadowColor"/>
    <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
    <feOffset in="blur" dx="-1.5" dy="-1.5" result="offsetHi"/>
    <feFlood flood-color="#FFFFFF" flood-opacity="0.18" result="hiColor"/>
    <feComposite in="hiColor" in2="offsetHi" operator="in" result="highlight"/>
    <feMerge><feMergeNode in="shadow"/><feMergeNode in="highlight"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
